version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      nextjs:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      database:
        patterns: ["drizzle-orm", "drizzle-kit", "pg", "@types/pg", "@electric-sql/pglite"]
      observability:
        patterns: ["dd-trace", "pino"]
      testing:
        patterns: ["vitest", "vite-tsconfig-paths"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
